<!DOCTYPE html>
<html>
<head>
	<style>
		/* 배경 설정 */
		body {
			background-color: #f0f2f5;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: 'Segoe UI', sans-serif;
		}

		/* 카드 스타일 */
		.card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 10px 25px rgba(0,0,0,0.1);
			padding: 30px;
			width: 300px;
			text-align: center;
			transition: transform 0.3s ease;
		}

		.card:hover {
			transform: translateY(-10px);
		}

		/* 원형 이미지 공간 */
		.profile-img {
			width: 100px;
			height: 100px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border-radius: 50%;
			margin: 0 auto 20px;
		}

		h2 {
			margin: 10px 0 5px;
			color: #333;
		}

		p {
			color: #777;
			font-size: 14px;
			line-height: 1.6;
		}

		/* 버튼 스타일 */
		.btn {
			display: inline-block;
			margin-top: 20px;
			padding: 10px 25px;
			background-color: #667eea;
			color: white;
			text-decoration: none;
			border-radius: 25px;
			font-weight: bold;
			font-size: 14px;
		}
	</style>
</head>
<body>

<div class="card">
	<div class="profile-img"></div>
	<h2>Gemini User</h2>
</div>

</body>
</html>
